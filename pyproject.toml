[project]
name = "multiscore"
version = "0.1.0"
description = "MultiScore: xG prediction with defender positioning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "statsbombpy>=1.14",
    "matplotlib>=3.9",
    "pyarrow>=17.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/multiscore"]

[tool.ruff]
line-length = 100
