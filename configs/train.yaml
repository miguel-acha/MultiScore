# Training configuration for MultiScore xG models.
# Every value here is reported verbatim in reports/metrics.json and
# models/model_card.json so the document's "Hiperparámetros" and
# "Infraestructura de entrenamiento" subsections can cite exact numbers.

random_seed: 42

# Random search budget per model family (LR / XGBoost / LightGBM), each run
# twice: once on geo-only features, once on geo+defender features.
n_hyperparam_trials: 30
cv_folds: 4 # GroupKFold folds within the La Liga training split

logistic_regression:
  C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  penalty: "l2"
  max_iter: 2000
  class_weight: "balanced"

xgboost:
  n_estimators: 2000 # upper bound; early stopping picks the real number
  early_stopping_rounds: 50
  learning_rate: [0.01, 0.03, 0.05, 0.1]
  max_depth: [2, 3, 4, 5, 6]
  subsample: [0.6, 0.8, 1.0]
  colsample_bytree: [0.6, 0.8, 1.0]
  min_child_weight: [1, 5, 10]
  reg_lambda: [0.0, 1.0, 5.0]
  objective: "binary:logistic"
  eval_metric: "logloss"

lightgbm:
  n_estimators: 2000
  early_stopping_rounds: 50
  learning_rate: [0.01, 0.03, 0.05, 0.1]
  num_leaves: [15, 31, 63]
  max_depth: [-1, 4, 6, 8]
  subsample: [0.6, 0.8, 1.0]
  colsample_bytree: [0.6, 0.8, 1.0]
  min_child_samples: [10, 20, 50]
  reg_lambda: [0.0, 1.0, 5.0]
  objective: "binary"
  metric: "binary_logloss"

# Threshold used for Precision/Recall/F1/confusion-matrix reporting, chosen
# as "the classic default" AND recomputed as "the F1-optimal threshold on
# validation" - both are reported, per the guide's requirement to justify
# any metric choice.
default_threshold: 0.5

bootstrap:
  n_resamples: 1000
  confidence_level: 0.95
  # Resampling is done by match_id (not by individual shot) to respect the
  # correlation between shots in the same match.
  group_column: "match_id"

# Synthetic empty-net shots, added ONLY to the "full" model's TRAINING
# split (never val/test/external_test - those stay 100% real shots for
# every reported metric). Real La Liga shots with an open goal are almost
# never a truly empty net from distance (usually a recovering keeper or a
# freeze frame that's missing the keeper), so the model never saw the
# simulator's actual "nobody within 40m, unpressured" scenario and badly
# underscored it (e.g. 27m, dead center, empty net: 16% instead of a
# near-certain goal). See ml/multiscore/synthetic.py.
synthetic_empty_net:
  enabled: true
  n: 400
  weight: 4.0 # per-row sample_weight multiplier - 400 synthetic positions
    # are a small fraction of the ~14k real training rows, so without this
    # they're outvoted by the mass of real long-range shots (almost all
    # misses, since a real "open goal" at range is essentially never a
    # genuinely empty net - see synthetic.py's module docstring) and the
    # augmentation barely moves predictions at 25-30m.
  sigma_foot_deg: 6 # angular shooting error std-dev, feet, StatsBomb degrees
  sigma_head_deg: 12
  mishit: 0.05 # fraction of clean-look shots that are mishit regardless of angle
  head_power_start_m: 8 # headers beyond this distance start losing scoring
    # probability to power/accuracy limits on top of the angular term -
    # inside this range a header is basically a normal close-range chance.
  head_power_decay_m: 4 # e-folding distance for that falloff: ~11m -> 0.47x,
    # ~16.5m -> 0.10x, ~22m -> 0.02x of the pure-angle probability.
