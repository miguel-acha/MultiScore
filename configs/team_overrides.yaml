# Manual overrides for ml/multiscore/crests.py, keyed by the team name as
# it appears in the browsable data (e.g. "Real Madrid", "Athletic Club").
#
#   "<team name>": "<wikidata_qid>"   # force a specific Wikidata match
#   "<team name>": "skip"             # never look this club up; always
